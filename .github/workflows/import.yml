name: Import ArchiBIM Joinery source
on:
  push:
    paths:
      - '.bootstrap/chunk-04.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore checked-in source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-01.b64 .bootstrap/chunk-02.b64 .bootstrap/chunk-03.b64 .bootstrap/chunk-04.b64 | base64 -d > /tmp/joinery.tar.xz
          echo "153af25a1609aaeb5631f35570ba684950014123193b0606a9c30ac359f6e81e  /tmp/joinery.tar.xz" | sha256sum --check -
          tar -xJf /tmp/joinery.tar.xz -C /tmp
          cp -a /tmp/ArchiBIM-Joinery/. .
          rm -rf .bootstrap
          ruby test/test_core.rb
          ruby build.rb
      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import ArchiBIM Joinery v0.1.0 source and tests"
          git push origin HEAD:main
