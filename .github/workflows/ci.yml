name: Joinery CI
on:
  push:
  pull_request:

# The publishing step only runs on successful pushes to main.
# This ensures the permanent README link always serves the last tested RBZ.
permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Ruby syntax check
        run: |
          find . -type f -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - name: Parameter engine tests
        run: |
          for testfile in test/test_*.rb; do ruby "$testfile" || exit 1; done
      - name: Build SketchUp RBZ
        run: ruby build.rb
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiBIM-Joinery-rbz
          path: dist/*.rbz
      - name: Publish latest RBZ to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*extension\.version = '\([^']*\)'.*/\1/p" ArchiBIM_Joinery.rb | head -n 1)"
          test -n "$version" || { echo "Missing extension version"; exit 1; }
          rbz="$(find dist -maxdepth 1 -type f -name '*.rbz' -print -quit)"
          test -n "$rbz" || { echo "Missing RBZ"; exit 1; }
          tag="v${version}"
          asset="${rbz}#ArchiBIM_Joinery_latest.rbz"
          notes="docs/RELEASE_NOTES_v${version}.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --latest
          else
            if [ -f "$notes" ]; then
              gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
                --title "ArchiBIM Joinery v${version} (beta)" --notes-file "$notes" --latest
            else
              gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
                --title "ArchiBIM Joinery v${version} (beta)" \
                --notes "Automated RBZ build from validated main branch. Test in SketchUp before production use." --latest
            fi
          fi

          echo "Latest RBZ: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ArchiBIM_Joinery_latest.rbz"
